name: Build APK and send to Telegram

on:
  push:
    branches: [dev]

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        # Split by ABI: the fat APK carries three architectures and came to
        # 55 MB, over Telegram's 50 MB bot upload limit. arm64 alone is ~17 MB,
        # and every Android phone worth sideloading onto since ~2019 is arm64.
        run: flutter build apk --release --split-per-abi

      - name: Send APK to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -lh "$apk"
          reply=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F caption="penny build ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" \
            -F document=@"$apk")
          echo "$reply"
          # curl exits 0 on a 413, so without this the job goes green having
          # delivered nothing — which is how the 55 MB APK went unnoticed.
          echo "$reply" | grep -q '"ok":true' || exit 1

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="penny build failed on ${GITHUB_REF_NAME} (${GITHUB_SHA::7}): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
